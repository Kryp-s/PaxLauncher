name: Release Linux
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot python3-pil

      - name: Build Linux packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP=PaxLauncher
          mkdir -p build/classes build/input dist

          # 1. Компіляція та JAR
          javac --release 21 -nowarn -encoding UTF-8 -d build/classes ./*.java
          jar --create --file "build/input/$APP.jar" --main-class "$APP" -C build/classes .

          # 2. Іконка: icon.ico -> PNG
          python3 - <<'PY'
          from PIL import Image
          ico = Image.open("icon.ico")
          try:
              ico.size = sorted(ico.info.get("sizes") or {ico.size}, key=lambda s: s[0] * s[1])[-1]
          except Exception:
              pass
          img = ico.convert("RGBA")
          if img.size != (256, 256):
              img = img.resize((256, 256), Image.LANCZOS)
          img.save("build/PaxLauncher.png", "PNG")
          PY

          # 3. Спільні параметри jpackage
          MODULES="java.base,java.desktop,java.net.http,java.management,java.logging,java.naming,java.prefs,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.compiler"
          COMMON=(
            --name "$APP"
            --app-version "$VERSION"
            --vendor "Kryp-s"
            --description "Український лаунчер Minecraft"
            --input build/input
            --main-jar "$APP.jar"
            --main-class "$APP"
            --icon "build/$APP.png"
            --license-file LICENSE
            --add-modules "$MODULES"
            --java-options "-Dfile.encoding=UTF-8"
          )

          # 4. Портативний архів (.tar.gz)
          jpackage --type app-image "${COMMON[@]}" --dest build/app-image
          tar -C build/app-image -czf "dist/$APP-$VERSION-linux-x64.tar.gz" "$APP"

          # 5. Пакет .deb
          jpackage --type deb "${COMMON[@]}" \
            --linux-package-name paxlauncher \
            --linux-menu-group Game \
            --linux-app-category games \
            --linux-shortcut \
            --dest build/deb
          cp build/deb/*.deb dist/

          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
