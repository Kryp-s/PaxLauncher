name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build app
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "PAX_VERSION=$VER" >> "$GITHUB_ENV"
          sed -i "s/static final String VERSION = \".*\";/static final String VERSION = \"$VER\";/" PaxLauncher.java
          mkdir -p build input dist zipdir
          javac -encoding UTF-8 -d build PaxLauncher.java
          jar cfe input/PaxLauncher.jar PaxLauncher -C build .
          MODS=java.desktop,java.net.http,java.management,java.logging,jdk.crypto.ec
          jpackage --type app-image --name PaxLauncher --app-version "$VER" --vendor "Kryp-s" \
            --description "Ukrainian Minecraft launcher" --copyright "Kryp-s" \
            --input input --main-jar PaxLauncher.jar --main-class PaxLauncher \
            --icon icon.ico --add-modules "$MODS" --dest zipdir
          (cd zipdir && 7z a "../dist/PaxLauncher-$VER-portable.zip" PaxLauncher)
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $t = Get-Content installer.iss -Raw -Encoding UTF8
          [IO.File]::WriteAllText("$PWD\installer-bom.iss", $t, (New-Object System.Text.UTF8Encoding $true))
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-bom.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
